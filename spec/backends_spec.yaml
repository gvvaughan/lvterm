specify the backends:
- describe agree on:
  - it plain text, wrapped and scrolled:
      if not both_backends then pending 'needs both backends' end
      expect(differences(noise(0) .. string.rep('wrap around this line ', 90), 5, 20)).to_equal {}
  - it attributes and colors:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27[1mb\27[3mi\27[4mu\27[5mk\27[7mr\27[8mc\27[9ms\27[0mn\27[31;44mc\27[38;5;202mx\27[48;2;1;2;3my')).to_equal {}
  - it wide and combining characters:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\228\184\173\230\150\135 e\204\129 \227\130\162a', 3, 20)).to_equal {}
  - it line drawing characters:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27(0lqqqk\r\nx   x\r\nmqqqj\27(B done', 5, 20)).to_equal {}
  - it the alternate screen:
      if not both_backends then pending 'needs both backends' end
      expect(differences('main\27[?1049h\27[2Jalt\27[?1049l back')).to_equal {}
  - it scroll regions and inserting and deleting:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27[2;5r\27[2;1Hone\r\ntwo\r\nsix\r\nten\r\nend\27[2;1H\27[2L\27[1M\27[3@\27[2P', 8, 20)).to_equal {}
  - it what the terminal sends back:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27[3;4H\27[6n\27[c', 5, 20)).to_equal {}
  - it a resize between writes:
      if not both_backends then pending 'needs both backends' end
      expect(differences('abcdefghij\r\nklmnopqrst', 5, 20, 'uvw', {3, 8})).to_equal {}
  - it a long deterministic stream of everything above, at several sizes:
      if not both_backends then pending 'needs both backends' end
      expect(differences(noise(3000), 24, 80)).to_equal {}
      expect(differences(noise(3000), 7, 13)).to_equal {}
      expect(differences(noise(3000), 1, 5)).to_equal {}
  - it scrollback, and what it gives back when the terminal is resized:
      if not both_backends then pending 'needs both backends' end
      expect(differences('a\27[31mb\27[0m\r\n\228\184\173c\r\nd\r\ne\r\nf\r\ng', 4, 6, 'x\r\ny', {2, 4})).to_equal {}
      expect(differences('a\r\nb\r\nc\r\nd\r\ne', 3, 6, '\r\nf', {5, 6})).to_equal {}
      expect(differences('a\r\nb\r\nc\r\nd\27[3J\r\ne', 2, 6)).to_equal {}
  - it the alternate screen, which has no scrollback, and the cursor being hidden:
      if not both_backends then pending 'needs both backends' end
      expect(differences('a\r\nb\r\nc\27[?1049h\27[?25lx\r\ny\r\nz\r\nw', 2, 6)).to_equal {}
      expect(differences('a\r\nb\r\nc\27[?1049h\27[?25lx\27[?1049l\27[?25h', 2, 6)).to_equal {}

- describe agree on what is sent for input:
  - it every key with every modifier, and every character, and a paste:
      if not both_backends then pending 'needs both backends' end
      expect(input_differences '').to_equal {}
  - it the same, with the cursor keys that the program asked for:
      if not both_backends then pending 'needs both backends' end
      expect(input_differences '\27[?1h').to_equal {}
  - it the same, with a paste that is bracketed:
      if not both_backends then pending 'needs both backends' end
      expect(input_differences '\27[?2004h').to_equal {}
  - it the same, for the mouse that the program asked to be told of, as each mode and encoding writes it:
      if not both_backends then pending 'needs both backends' end
      for _, stream in ipairs {
         '\27[?1000h', '\27[?1000h\27[?1006h', '\27[?1002h\27[?1006h',
         '\27[?1003h\27[?1006h', '\27[?1003h\27[?1005h', '\27[?1003h\27[?1015h',
      } do
         expect(input_differences(stream)).to_equal {}
      end

- describe agree on what the program says of itself:
  - it the title, and one that comes in pieces:
      if not both_backends then pending 'needs both backends' end
      expect(differences('a\27]0;one\7b\27]2;two\27\\c\27]2;thr', 2, 8, 'ee\7')).to_equal {}
  - it a title that was cancelled, and the one that follows:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27]2;first\7\27]2;abc', 2, 8, '\24\27]2;def\7')).to_equal {}
  - it a title of text that is not ASCII, and of none:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27]2;caf\195\169 \228\184\173\7\27]2;\7')).to_equal {}
  - it the bells:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\7a\7\27]2;t\7')).to_equal {}
  - it what the mouse is asked for, and after a reset:
      if not both_backends then pending 'needs both backends' end
      expect(differences('\27[?1000h\27[?1002h')).to_equal {}
      expect(differences('\27[?1003h\27[?1003l')).to_equal {}
  - it the same, for what the focus reports when the program asked for them:
      if not both_backends then pending 'needs both backends' end
      expect(input_differences '\27[?1004h').to_equal {}
  - it the same, with the properties set by set_termprop and not by the program:
      if not both_backends then pending 'needs both backends' end
      for _, mode in ipairs {'click', 'drag', 'move'} do
         expect(input_differences('\27[?1006h', function(term)
            term:set_termprop('mouse', mode)
            term:set_termprop('focusreport', true)
         end)).to_equal {}
      end
  - it the same, with the modes set by set_mode and not by the program:
      if not both_backends then pending 'needs both backends' end
      for _, encoding in ipairs {'x10', 'utf8', 'sgr', 'urxvt'} do
         expect(input_differences('', function(term)
            term:set_termprop('mouse', 'drag')
            term:set_mode('mouse_encoding', encoding)
            term:set_mode('bracketed_paste', true)
            term:set_mode('application_cursor_keys', true)
         end)).to_equal {}
      end
