before:
  lvterm = require 'lvterm'

  -- The text of a line of the scrollback.
  function scrolled(term, n)
     local out = {}
     for i, cell in ipairs(term:scrollback_line(n)) do
        out[i] = cell.text
     end
     return table.concat(out)
  end

  -- What a program that uses lvterm prints, run in a process of its own.  LuaJIT
  -- is only safe from a callback in a call that it compiled once the call has
  -- made one, so an example that needs it not to have has to be in a process
  -- where no other example has.
  function fresh(body)
     local name = os.tmpname()
     local file = io.open(name, 'w')
     file:write("local lvterm = require 'lvterm'\n", body, "\nprint 'done'\n")
     file:close()
     local first = -1
     while arg[first - 1] do
        first = first - 1
     end
     local command = string.format('LUA_PATH=%q LUA_CPATH=%q %q %q 2>&1',
                                   package.path, package.cpath, arg[first], name)
     local pipe = io.popen(command)
     local out = pipe:read '*a'
     pipe:close()
     os.remove(name)
     return out
  end

  -- What the terminal sends for one key, one character, or a paste, which it then forgets.
  function keys(term, name, mods)
     term:key(name, mods)
     return term:output()
  end

  function chars(term, cp, mods)
     term:char(cp, mods)
     return term:output()
  end

  function pastes(term, text)
     term:paste(text)
     return term:output()
  end

  -- What the terminal sends for the mouse at a place, with a button pressed or released there.
  function clicks(term, row, col, button, pressed, mods)
     term:mouse_move(row, col, mods)
     term:output()
     term:mouse_button(button, pressed, mods)
     return term:output()
  end

specify lvterm:
- describe the backend:
  - it is one that exists:
      known = {ffi = true, core = true}
      expect(known[lvterm.backend]).to_be(true)
  - it is the one that was asked for:
      wanted = os.getenv 'LVTERM_BACKEND'
      expect(lvterm.backend).to_be(wanted or lvterm.backend)

- describe new:
  - it makes a terminal of the size asked for:
      term = lvterm.new(5, 20)
      expect({term:size()}).to_equal {5, 20}
  - it makes a terminal of 24 lines and 80 columns by default:
      term = lvterm.new()
      expect({term:size()}).to_equal {24, 80}
  - it diagnoses a size that is not positive:
      expect(lvterm.new(0, 80)).to_raise 'positive rows and columns'
      expect(lvterm.new(24, 0)).to_raise 'positive rows and columns'
  - it diagnoses a scrollback that is not a number of lines:
      expect(lvterm.new(2, 4, {scrollback = -1})).to_raise 'number of lines'
      expect(lvterm.new(2, 4, {scrollback = 1.5})).to_raise 'number of lines'
      expect(lvterm.new(2, 4, {scrollback = 'all'})).to_raise 'number of lines'
  - it starts with an empty screen and the cursor at the top left:
      term = lvterm.new(3, 4)
      expect(term:lines()).to_equal {'    ', '    ', '    '}
      expect({term:cursor()}).to_equal {0, 0}

- describe write:
  - it puts text at the cursor and moves the cursor:
      term = lvterm.new(5, 20)
      term:write 'hello'
      expect(term:text(0, 0, 5)).to_be 'hello'
      expect({term:cursor()}).to_equal {0, 5}
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(5, 20)
      expect(term:write('a'):write('b')).to_be(term)
      expect(term:text(0, 0, 2)).to_be 'ab'
  - it moves the cursor when told to:
      term = lvterm.new(5, 20)
      term:write '\27[3;5Hx'
      expect(term:text(2, 4, 1)).to_be 'x'
      expect({term:cursor()}).to_equal {2, 5}
  - it moves to the start of the next line:
      term = lvterm.new(5, 20)
      term:write 'ab\r\ncd'
      expect(term:text(0, 0, 2)).to_be 'ab'
      expect(term:text(1, 0, 2)).to_be 'cd'
  - it wraps at the end of a line:
      term = lvterm.new(3, 4)
      term:write 'abcde'
      expect(term:row(0)).to_be 'abcd'
      expect(term:row(1)).to_be 'e   '
      expect({term:cursor()}).to_equal {1, 1}
  - it scrolls at the bottom of the screen:
      term = lvterm.new(2, 3)
      term:write 'one\r\ntwo\r\nsix'
      expect(term:lines()).to_equal {'two', 'six'}
  - it erases the screen:
      term = lvterm.new(2, 3)
      term:write('abc'):write '\27[2J'
      expect(term:lines()).to_equal {'   ', '   '}
  - it erases to the end of the line:
      term = lvterm.new(2, 4)
      term:write 'abcd\27[1;3H\27[K'
      expect(term:row(0)).to_be 'ab  '
  - it decodes UTF-8:
      term = lvterm.new(2, 6)
      term:write 'h\195\169llo'
      expect(term:text(0, 0, 5)).to_be 'h\195\169llo'
  - it draws lines from the DEC special graphics character set:
      term = lvterm.new(2, 6)
      term:write '\27(0lqqk\27(B'
      expect(term:text(0, 0, 4)).to_be '\226\148\140\226\148\128\226\148\128\226\148\144'
  - it switches to the alternate screen and back:
      term = lvterm.new(3, 6)
      term:write 'main\27[?1049h\27[2J\27[1;1Halt'
      expect(term:text(0, 0, 3)).to_be 'alt'
      term:write '\27[?1049l'
      expect(term:text(0, 0, 4)).to_be 'main'

- describe text:
  - it reads part of a row:
      term = lvterm.new(2, 10)
      term:write 'abcdefghij'
      expect(term:text(0, 2, 3)).to_be 'cde'
  - it reads to the end of the row by default:
      term = lvterm.new(2, 5)
      term:write 'abcde'
      expect(term:text(0, 3)).to_be 'de'
  - it has a space for each empty cell:
      term = lvterm.new(2, 5)
      term:write 'a\27[1;4Hb'
      expect(term:row(0)).to_be 'a  b '
  - it is as wide as the columns that it was asked for:
      term = lvterm.new(2, 5)
      expect(#term:text(1, 1, 3)).to_be(3)
  - it counts a wide character as the two columns that it takes:
      term = lvterm.new(2, 6)
      term:write '\228\184\173a'
      expect(term:text(0, 0, 3)).to_be '\228\184\173a'
      expect(term:text(0, 0, 2)).to_be '\228\184\173'
  - it diagnoses a position outside the screen:
      term = lvterm.new(2, 5)
      expect(term:text(2, 0)).to_raise 'outside a screen of 2,5'
      expect(term:text(0, 5)).to_raise 'outside a screen of 2,5'
      expect(term:text(0, 3, 3)).to_raise 'outside a screen of 5 columns'

- describe cell:
  - it describes an empty cell:
      term = lvterm.new(2, 5)
      expect(term:cell(0, 0)).to_equal {
         text = ' ', width = 1, bold = false, italic = false, blink = false,
         reverse = false, conceal = false, strike = false, underline = 0,
      }
  - it describes a character:
      term = lvterm.new(2, 5)
      term:write 'x'
      cell = term:cell(0, 0)
      expect(cell.text).to_be 'x'
      expect(cell.width).to_be(1)
  - it has the attributes that were set:
      term = lvterm.new(2, 8)
      term:write '\27[1mb\27[3mi\27[4mu\27[5mk\27[7mr\27[8mc\27[9ms\27[0mn'
      expect(term:cell(0, 0).bold).to_be(true)
      expect(term:cell(0, 1).italic).to_be(true)
      expect(term:cell(0, 2).underline).to_be(1)
      expect(term:cell(0, 3).blink).to_be(true)
      expect(term:cell(0, 4).reverse).to_be(true)
      expect(term:cell(0, 5).conceal).to_be(true)
      expect(term:cell(0, 6).strike).to_be(true)
  - it has no attributes after they are reset:
      term = lvterm.new(2, 8)
      term:write '\27[1;3;4;5;7;8;9m\27[0mn'
      expect(term:cell(0, 0)).to_equal {
         text = 'n', width = 1, bold = false, italic = false, blink = false,
         reverse = false, conceal = false, strike = false, underline = 0,
      }
  - it has no color by default, and a palette index when set:
      term = lvterm.new(2, 5)
      term:write 'a\27[31;44mb'
      expect(term:cell(0, 0).fg).to_be(nil)
      expect(term:cell(0, 0).bg).to_be(nil)
      expect(term:cell(0, 1).fg).to_be(1)
      expect(term:cell(0, 1).bg).to_be(4)
  - it has an RGB color when set:
      term = lvterm.new(2, 5)
      term:write '\27[38;2;10;20;30mx'
      expect(term:cell(0, 0).fg).to_equal {red = 10, green = 20, blue = 30}
  - it spans two cells for a wide character:
      term = lvterm.new(2, 5)
      term:write '\228\184\173'
      expect(term:cell(0, 0).text).to_be '\228\184\173'
      expect(term:cell(0, 0).width).to_be(2)
      expect(term:cell(0, 1).text).to_be ''
  - it diagnoses a position outside the screen:
      term = lvterm.new(2, 5)
      expect(term:cell(2, 0)).to_raise 'outside a screen of 2,5'
      expect(term:cell(0, -1)).to_raise 'outside a screen of 2,5'

- describe resize:
  - it changes the size of the terminal:
      term = lvterm.new(2, 5)
      expect(term:resize(4, 8)).to_be(term)
      expect({term:size()}).to_equal {4, 8}
      expect(#term:lines()).to_be(4)
      expect(#term:row(0)).to_be(8)

- describe reset:
  - it clears the screen and moves the cursor home:
      term = lvterm.new(2, 3)
      term:write 'abc\r\ndef'
      term:reset()
      expect(term:lines()).to_equal {'   ', '   '}
      expect({term:cursor()}).to_equal {0, 0}

- describe output:
  - it answers a request for the position of the cursor:
      term = lvterm.new(5, 20)
      term:write '\27[2;3H\27[6n'
      expect(term:output()).to_be '\27[2;3R'
  - it forgets what it has given out:
      term = lvterm.new(5, 20)
      term:write '\27[6n'
      term:output()
      expect(term:output()).to_be ''
  - it has nothing to say unless it is asked:
      term = lvterm.new(5, 20)
      term:write 'hello'
      expect(term:output()).to_be ''

- describe scrollback:
  - it has no lines to start with:
      term = lvterm.new(2, 4)
      expect(term:scrollback_size()).to_be(0)
  - it has the lines that scrolled off the top, the newest first:
      term = lvterm.new(2, 4)
      term:write 'a\r\nb\r\nc\r\nd'
      expect(term:lines()).to_equal {'c   ', 'd   '}
      expect(term:scrollback_size()).to_be(2)
      expect(scrolled(term, 1)).to_be 'b   '
      expect(scrolled(term, 2)).to_be 'a   '
  - it has a cell for each column of the line as it was:
      term = lvterm.new(2, 4)
      term:write 'ab\r\ncd\r\nef'
      expect(#term:scrollback_line(1)).to_be(4)
      expect(term:scrollback_line(1)[1].text).to_be 'a'
      expect(term:scrollback_line(1)[3].text).to_be ' '
  - it has cells like those of the screen, with the colors and attributes that they had:
      term = lvterm.new(2, 4)
      term:write '\27[1;31mx\27[0m\27[38;2;1;2;3my\r\n\r\n'
      cell = term:scrollback_line(1)[1]
      expect(cell.text).to_be 'x'
      expect(cell.bold).to_be(true)
      expect(cell.fg).to_be(1)
      expect(term:scrollback_line(1)[2].fg).to_equal {red = 1, green = 2, blue = 3}
      expect(term:scrollback_line(1)[3]).to_equal(term:cell(0, 3))
  - it keeps a wide character with the cell that follows it:
      term = lvterm.new(2, 4)
      term:write '\228\184\173a\r\n\r\n'
      expect(term:scrollback_line(1)[1].text).to_be '\228\184\173'
      expect(term:scrollback_line(1)[1].width).to_be(2)
      expect(term:scrollback_line(1)[2].text).to_be ''
      expect(term:scrollback_line(1)[3].text).to_be 'a'
  - it keeps the lines of a long run, and the oldest is the first:
      term = lvterm.new(3, 12)
      for i = 1, 500 do
         term:write(string.format('line %d\r\n', i))
      end
      expect(term:scrollback_size()).to_be(498)
      expect(scrolled(term, 498)).to_be(string.format('%-12s', 'line 1'))
      expect(scrolled(term, 1)).to_be(string.format('%-12s', 'line 498'))
  - it keeps no more lines than it was told to:
      term = lvterm.new(2, 4, {scrollback = 3})
      term:write 'a\r\nb\r\nc\r\nd\r\ne\r\nf'
      expect(term:scrollback_size()).to_be(3)
      expect(scrolled(term, 1)).to_be 'd   '
      expect(scrolled(term, 3)).to_be 'b   '
  - it keeps none if it was told to keep none:
      term = lvterm.new(2, 4, {scrollback = 0})
      term:write 'a\r\nb\r\nc\r\nd'
      expect(term:scrollback_size()).to_be(0)
      expect(term:lines()).to_equal {'c   ', 'd   '}
  - it has as many lines as there is memory for if it was not told:
      term = lvterm.new(2, 4)
      for _ = 1, 2000 do
         term:write 'x\r\n'
      end
      expect(term:scrollback_size()).to_be(2000 - 1)
  - it diagnoses a line that is not there:
      term = lvterm.new(2, 4)
      term:write 'a\r\nb\r\nc'
      expect(term:scrollback_line(0)).to_raise 'outside a scrollback of 1'
      expect(term:scrollback_line(2)).to_raise 'outside a scrollback of 1'
      expect(term:scrollback_line(1.5)).to_raise 'outside a scrollback of 1'
  - it is forgotten by scrollback_clear:
      term = lvterm.new(2, 4)
      term:write 'a\r\nb\r\nc\r\nd'
      expect(term:scrollback_clear()).to_be(term)
      expect(term:scrollback_size()).to_be(0)
      expect(term:lines()).to_equal {'c   ', 'd   '}
  - it is forgotten when the program asks for the scrollback to be erased:
      term = lvterm.new(2, 4)
      term:write 'a\r\nb\r\nc\r\nd\27[3J'
      expect(term:scrollback_size()).to_be(0)
  - it is not made by the alternate screen, which does not scroll back:
      term = lvterm.new(2, 4)
      term:write 'a\r\nb\r\nc'
      term:write '\27[?1049h'
      for _ = 1, 10 do
         term:write 'x\r\n'
      end
      expect(term:scrollback_size()).to_be(1)
      term:write '\27[?1049l'
      expect(term:scrollback_size()).to_be(1)
      expect(scrolled(term, 1)).to_be 'a   '
  - it is not made by a scroll of part of the screen:
      term = lvterm.new(4, 4)
      term:write '\27[2;3r\27[2;1Ha\r\nb\r\nc\r\nd'
      expect(term:scrollback_size()).to_be(0)
  - it takes the lines that go when the terminal is made smaller:
      term = lvterm.new(3, 4)
      term:write 'a\r\nb\r\nc'
      term:resize(2, 4)
      expect(term:scrollback_size()).to_be(1)
      expect(scrolled(term, 1)).to_be 'a   '
      expect(term:lines()).to_equal {'b   ', 'c   '}
  - it gives lines back when the terminal is made larger:
      term = lvterm.new(3, 4)
      term:write 'a\r\nb\r\nc\r\nd'
      expect(term:scrollback_size()).to_be(1)
      term:resize(4, 4)
      expect(term:scrollback_size()).to_be(0)
      expect(term:lines()).to_equal {'a   ', 'b   ', 'c   ', 'd   '}
  - it cuts a line to the width that it is given back at:
      term = lvterm.new(2, 6)
      term:write 'abcdef\r\nxy\r\nz'
      expect(term:scrollback_size()).to_be(1)
      term:resize(2, 3)
      term:resize(3, 3)
      expect(term:scrollback_size()).to_be(0)
      expect(term:row(0)).to_be 'abc'
  - it does not give back half of a wide character that the width cuts in two:
      term = lvterm.new(2, 4)
      term:write 'ab\228\184\173\r\nxy\r\nz'
      expect(scrolled(term, 1)).to_be 'ab\228\184\173'
      term:resize(2, 3)
      term:resize(3, 3)
      expect(term:scrollback_size()).to_be(0)
      expect(term:row(0)).to_be 'ab '
  - it pads a line to the width that it is given back at:
      term = lvterm.new(2, 3)
      term:write 'abc\r\nde\r\nf'
      term:resize(2, 6)
      term:resize(3, 6)
      expect(term:scrollback_size()).to_be(0)
      expect(term:row(0)).to_be 'abc   '

- describe the output that makes a loop hot before anything calls back:
  - it still scrolls when the first line to scroll comes after many writes that did not:
      out = fresh [[
         local term = lvterm.new(5, 40)
         for i = 1, 250 do
            term:write 'x'
         end
         print(term:scrollback_size(), term:row(4))
      ]]
      expect(out).to_be('2\t' .. string.rep('x', 10) .. string.rep(' ', 30) .. '\ndone\n')

  - it still tells the program of the mouse when the first move that does comes after many that did not:
      out = fresh [[
         local term = lvterm.new(5, 40)
         for i = 1, 250 do
            term:mouse_move(0, i % 40)
            term:mouse_button('left', i % 2 == 0)
         end
         term:write '\27[?1000h\27[?1006h'
         term:mouse_move(1, 2)
         term:mouse_button('right', true)
         print((term:output():gsub('\27', 'E')))
      ]]
      expect(out).to_be 'E[<2;3;2M\ndone\n'

  - it still tells the program of the focus when the first report comes after many calls that sent none:
      out = fresh [[
         local term = lvterm.new(5, 40)
         for i = 1, 250 do
            term:focus_in()
            term:focus_out()
         end
         term:write '\27[?1004h'
         term:focus_in()
         term:focus_out()
         print((term:output():gsub('\27', 'E')))
      ]]
      expect(out).to_be 'E[IE[O\ndone\n'

- describe altscreen:
  - it is not on to start with:
      term = lvterm.new(2, 4)
      expect(term:altscreen()).to_be(false)
  - it is on while the program is on the alternate screen:
      term = lvterm.new(2, 4)
      term:write '\27[?1049h'
      expect(term:altscreen()).to_be(true)
      term:write '\27[?1049l'
      expect(term:altscreen()).to_be(false)
  - it is on for the other sequence that switches to it, which has no screen of the main one saved:
      term = lvterm.new(2, 4)
      term:write 'ab\27[?1047h'
      expect(term:altscreen()).to_be(true)
      expect(term:row(0)).to_be '    '
      term:write '\27[?1047l'
      expect(term:altscreen()).to_be(false)
      expect(term:row(0)).to_be 'ab  '
  - it is not for a sequence that libvterm does not take to be a switch:
      term = lvterm.new(2, 4)
      term:write '\27[?47h'
      expect(term:altscreen()).to_be(false)
  - it is still on after a reset, as the screen is the alternate one, which the reset clears:
      term = lvterm.new(2, 4)
      term:write 'ab\27[?1049hcd'
      term:reset(true)
      expect(term:altscreen()).to_be(true)
      expect(term:row(0)).to_be '    '
      term:write '\27[?1049l'
      expect(term:altscreen()).to_be(false)
      expect(term:row(0)).to_be 'ab  '

- describe cursor_visible:
  - it is true to start with:
      term = lvterm.new(2, 4)
      expect(term:cursor_visible()).to_be(true)
  - it follows the program hiding and showing the cursor:
      term = lvterm.new(2, 4)
      term:write '\27[?25l'
      expect(term:cursor_visible()).to_be(false)
      term:write '\27[?25h'
      expect(term:cursor_visible()).to_be(true)
  - it is true again after a hard reset:
      term = lvterm.new(2, 4)
      term:write '\27[?25l'
      term:reset(true)
      expect(term:cursor_visible()).to_be(true)

- describe key:
  - it sends the keys that are the same in every mode:
      term = lvterm.new(2, 4)
      expect(keys(term, 'enter')).to_be '\r'
      expect(keys(term, 'tab')).to_be '\t'
      expect(keys(term, 'backspace')).to_be '\127'
      expect(keys(term, 'escape')).to_be '\27'
  - it sends the arrows, with the cursor keys that the program asked for:
      term = lvterm.new(2, 4)
      expect(keys(term, 'up')).to_be '\27[A'
      expect(keys(term, 'down')).to_be '\27[B'
      expect(keys(term, 'right')).to_be '\27[C'
      expect(keys(term, 'left')).to_be '\27[D'
      term:write '\27[?1h'
      expect(keys(term, 'up')).to_be '\27OA'
      expect(keys(term, 'left')).to_be '\27OD'
      term:write '\27[?1l'
      expect(keys(term, 'up')).to_be '\27[A'
  - it sends the editing keys:
      term = lvterm.new(2, 4)
      expect(keys(term, 'insert')).to_be '\27[2~'
      expect(keys(term, 'delete')).to_be '\27[3~'
      expect(keys(term, 'home')).to_be '\27[H'
      expect(keys(term, 'end')).to_be '\27[F'
      expect(keys(term, 'pageup')).to_be '\27[5~'
      expect(keys(term, 'pagedown')).to_be '\27[6~'
  - it sends the function keys:
      term = lvterm.new(2, 4)
      expect(keys(term, 'f1')).to_be '\27OP'
      expect(keys(term, 'f4')).to_be '\27OS'
      expect(keys(term, 'f5')).to_be '\27[15~'
      expect(keys(term, 'f12')).to_be '\27[24~'
  - it sends the modifiers that are held:
      term = lvterm.new(2, 4)
      expect(keys(term, 'up', {shift = true})).to_be '\27[1;2A'
      expect(keys(term, 'up', {alt = true})).to_be '\27[1;3A'
      expect(keys(term, 'up', {ctrl = true})).to_be '\27[1;5A'
      expect(keys(term, 'up', {shift = true, ctrl = true})).to_be '\27[1;6A'
      expect(keys(term, 'delete', {ctrl = true})).to_be '\27[3;5~'
      expect(keys(term, 'tab', {shift = true})).to_be '\27[Z'
  - it is no modifier for a modifier that is false:
      term = lvterm.new(2, 4)
      expect(keys(term, 'up', {shift = false, alt = false, ctrl = false})).to_be '\27[A'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:key 'up').to_be(term)
  - it is not a key that it does not have:
      term = lvterm.new(2, 4)
      expect(term:key 'f13').to_raise 'unknown key'
      expect(term:key 'space').to_raise 'unknown key'
      expect(term:key(nil)).to_raise 'unknown key'
  - it is the reply that output takes, in the order that they were made:
      term = lvterm.new(2, 4)
      term:key 'up'
      term:write '\27[6n'
      term:key 'down'
      expect(term:output()).to_be '\27[A\27[1;1R\27[B'

- describe char:
  - it sends the character:
      term = lvterm.new(2, 4)
      expect(chars(term, 97)).to_be 'a'
      expect(chars(term, 0x20)).to_be ' '
  - it sends a character as UTF-8:
      term = lvterm.new(2, 4)
      expect(chars(term, 0xe9)).to_be '\195\169'
      expect(chars(term, 0x4e2d)).to_be '\228\184\173'
      expect(chars(term, 0x1f600)).to_be '\240\159\152\128'
  - it sends control characters for a held control:
      term = lvterm.new(2, 4)
      expect(chars(term, 97, {ctrl = true})).to_be '\1'
      expect(chars(term, 0x5d, {ctrl = true})).to_be '\29'
  - it sends escape before a character for a held alt:
      term = lvterm.new(2, 4)
      expect(chars(term, 97, {alt = true})).to_be '\27a'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:char(97)).to_be(term)
  - it diagnoses what is not a character:
      term = lvterm.new(2, 4)
      expect(term:char(-1)).to_raise 'not a character'
      expect(term:char(0x110000)).to_raise 'not a character'
      expect(term:char('a')).to_raise 'not a character'

- describe paste:
  - it sends the text as it is:
      term = lvterm.new(2, 4)
      expect(pastes(term, 'hello\nthere')).to_be 'hello\nthere'
  - it sends bytes that are not text, and nothing else:
      term = lvterm.new(2, 4)
      expect(pastes(term, '\0\1\255\27')).to_be '\0\1\255\27'
  - it puts the text between the marks that bracketed paste asked for:
      term = lvterm.new(2, 4)
      term:write '\27[?2004h'
      expect(pastes(term, 'hi')).to_be '\27[200~hi\27[201~'
      term:write '\27[?2004l'
      expect(pastes(term, 'hi')).to_be 'hi'
  - it is as long as the text is, whatever the size of a reply:
      term = lvterm.new(2, 4)
      text = string.rep('0123456789', 5000)
      expect(pastes(term, text)).to_be(text)
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:paste 'x').to_be(term)
  - it sends nothing for no text:
      term = lvterm.new(2, 4)
      expect(pastes(term, '')).to_be ''

- describe mouse_mode:
  - it is none to start with:
      term = lvterm.new(2, 4)
      expect(term:mouse_mode()).to_be 'none'
  - it follows what the program asks for:
      term = lvterm.new(2, 4)
      term:write '\27[?1000h'
      expect(term:mouse_mode()).to_be 'click'
      term:write '\27[?1002h'
      expect(term:mouse_mode()).to_be 'drag'
      term:write '\27[?1003h'
      expect(term:mouse_mode()).to_be 'move'
  - it goes back to none when the program asks for no more:
      term = lvterm.new(2, 4)
      term:write '\27[?1000h\27[?1000l'
      expect(term:mouse_mode()).to_be 'none'
  - it is none after a reset, when nothing is sent for the mouse any more:
      term = lvterm.new(5, 20)
      term:write '\27[?1003h\27[?1006h'
      term:reset(true)
      expect(term:mouse_mode()).to_be 'none'
      expect(clicks(term, 1, 1, 'left', true)).to_be ''
  - it is none after a soft reset too:
      term = lvterm.new(5, 20)
      term:write '\27[?1003h\27[?1006h'
      term:reset(false)
      expect(term:mouse_mode()).to_be 'none'
      expect(clicks(term, 1, 1, 'left', true)).to_be ''

- describe mouse_button:
  - it sends nothing while the program has not asked for the mouse:
      term = lvterm.new(5, 20)
      expect(clicks(term, 2, 3, 'left', true)).to_be ''
  - it sends a press as the program asked for it to be written:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      expect(clicks(term, 2, 3, 'left', true)).to_be '\27[<0;4;3M'
  - it sends a release with a lower case final, as that mode writes it:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      clicks(term, 2, 3, 'left', true)
      expect(clicks(term, 2, 3, 'left', false)).to_be '\27[<0;4;3m'
  - it numbers the buttons:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      expect(clicks(term, 0, 0, 'middle', true)).to_be '\27[<1;1;1M'
      expect(clicks(term, 0, 0, 'right', true)).to_be '\27[<2;1;1M'
  - it sends the wheel as a press, which has no release:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      expect(clicks(term, 1, 1, 'wheelup', true)).to_be '\27[<64;2;2M'
      expect(clicks(term, 1, 1, 'wheeldown', true)).to_be '\27[<65;2;2M'
      expect(clicks(term, 1, 1, 'wheelleft', true)).to_be '\27[<66;2;2M'
      expect(clicks(term, 1, 1, 'wheelright', true)).to_be '\27[<67;2;2M'
  - it adds the modifiers that are held:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      expect(clicks(term, 0, 0, 'left', true, {shift = true})).to_be '\27[<4;1;1M'
      term:mouse_button('left', false)
      term:output()
      expect(clicks(term, 0, 0, 'left', true, {alt = true})).to_be '\27[<8;1;1M'
      term:mouse_button('left', false)
      term:output()
      expect(clicks(term, 0, 0, 'left', true, {ctrl = true})).to_be '\27[<16;1;1M'
  - it sends the older encoding of a release when SGR was not asked for:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h'
      clicks(term, 2, 3, 'left', true)
      expect(clicks(term, 2, 3, 'left', false)).to_be '\27[M#$#'
  - it sends the older encoding of a press, which says where in a byte for each:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h'
      expect(clicks(term, 2, 3, 'left', true)).to_be '\27[M $#'
  - it does not send a press again for a button that is down already:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      clicks(term, 2, 3, 'left', true)
      expect(clicks(term, 2, 3, 'left', true)).to_be ''
  - it diagnoses a button that there is not:
      term = lvterm.new(5, 20)
      expect(term:mouse_button('back', true)).to_raise 'unknown button'
      expect(term:mouse_button(1, true)).to_raise 'unknown button'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(5, 20)
      expect(term:mouse_button('left', true)).to_be(term)

- describe mouse_move:
  - it sends nothing when the program asked only for clicks:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      term:mouse_move(3, 4)
      expect(term:output()).to_be ''
  - it sends the move of a drag only while a button is down:
      term = lvterm.new(5, 20)
      term:write '\27[?1002h\27[?1006h'
      term:mouse_move(1, 1)
      expect(term:output()).to_be ''
      clicks(term, 1, 1, 'left', true)
      term:mouse_move(3, 5)
      expect(term:output()).to_be '\27[<32;6;4M'
  - it sends every move when the program asked for them:
      term = lvterm.new(5, 20)
      term:write '\27[?1003h\27[?1006h'
      term:mouse_move(4, 5)
      expect(term:output()).to_be '\27[<35;6;5M'
  - it sends a move only when the place changed:
      term = lvterm.new(5, 20)
      term:write '\27[?1003h\27[?1006h'
      term:mouse_move(4, 5)
      term:output()
      term:mouse_move(4, 5)
      expect(term:output()).to_be ''
  - it says where the mouse is for a press that follows:
      term = lvterm.new(5, 20)
      term:write '\27[?1000h\27[?1006h'
      term:mouse_move(0, 19)
      term:mouse_button('left', true)
      expect(term:output()).to_be '\27[<0;20;1M'
  - it diagnoses a place that is not on the screen:
      term = lvterm.new(5, 20)
      expect(term:mouse_move(5, 0)).to_raise 'outside a screen'
      expect(term:mouse_move(0, 20)).to_raise 'outside a screen'
      expect(term:mouse_move(-1, 0)).to_raise 'outside a screen'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(5, 20)
      expect(term:mouse_move(0, 0)).to_be(term)

- describe title:
  - it is nil until the program sets one:
      term = lvterm.new(2, 4)
      expect(term:title()).to_be(nil)
  - it is what the program set, ended either way:
      term = lvterm.new(2, 4)
      term:write '\27]2;one\7'
      expect(term:title()).to_be 'one'
      term:write '\27]2;two\27\\'
      expect(term:title()).to_be 'two'
  - it is set by the sequence that sets the name of the icon as well:
      term = lvterm.new(2, 4)
      term:write '\27]0;both\7'
      expect(term:title()).to_be 'both'
  - it is not set by the sequence that sets only the name of the icon:
      term = lvterm.new(2, 4)
      term:write '\27]1;icon\7'
      expect(term:title()).to_be(nil)
  - it is the last title that was whole, while one is still being written:
      term = lvterm.new(2, 4)
      term:write '\27]2;first\7\27]2;sec'
      expect(term:title()).to_be 'first'
      term:write 'ond\7'
      expect(term:title()).to_be 'second'
  - it is not changed by a title that the program cancelled, nor does that become part of the next:
      term = lvterm.new(2, 4)
      term:write '\27]2;first\7\27]2;abc'
      term:write '\24'
      expect(term:title()).to_be 'first'
      term:write '\27]2;def\7'
      expect(term:title()).to_be 'def'
  - it is empty when the program set an empty title, which is not no title:
      term = lvterm.new(2, 4)
      term:write '\27]2;one\7\27]2;\7'
      expect(term:title()).to_be ''
  - it is as written for text that is not ASCII:
      term = lvterm.new(2, 4)
      term:write '\27]2;caf\195\169 \228\184\173\7'
      expect(term:title()).to_be 'caf\195\169 \228\184\173'
  - it is as long as written:
      term = lvterm.new(2, 4)
      title = string.rep('0123456789', 500)
      term:write('\27]2;' .. title .. '\7')
      expect(term:title()).to_be(title)
  - it is not drawn on the screen:
      term = lvterm.new(2, 8)
      term:write 'a\27]2;title\7b'
      expect(term:row(0)).to_be 'ab      '

- describe bells:
  - it is none to start with:
      term = lvterm.new(2, 4)
      expect(term:bells()).to_be(0)
  - it counts the bells that were rung:
      term = lvterm.new(2, 4)
      term:write '\7a\7\7'
      expect(term:bells()).to_be(3)
  - it forgets them when it is asked:
      term = lvterm.new(2, 4)
      term:write '\7\7'
      term:bells()
      expect(term:bells()).to_be(0)
  - it is not rung by the end of a title, which is also a bell:
      term = lvterm.new(2, 4)
      term:write '\27]2;title\7'
      expect(term:bells()).to_be(0)
  - it is not drawn on the screen:
      term = lvterm.new(2, 4)
      term:write 'a\7b'
      expect(term:row(0)).to_be 'ab  '

- describe set_termprop:
  - it sets the mouse that the program is told of, as `mouse_mode` says:
      term = lvterm.new(2, 4)
      term:set_termprop('mouse', 'click')
      expect(term:mouse_mode()).to_be 'click'
      term:set_termprop('mouse', 'drag')
      expect(term:mouse_mode()).to_be 'drag'
      term:set_termprop('mouse', 'move')
      expect(term:mouse_mode()).to_be 'move'
      term:set_termprop('mouse', 'none')
      expect(term:mouse_mode()).to_be 'none'
  - it makes the terminal tell the program of the mouse, in the form that is used until the program asks for another:
      term = lvterm.new(5, 20)
      term:set_termprop('mouse', 'click')
      expect(clicks(term, 2, 3, 'left', true)).to_be '\27[M $#'
  - it is the same as the program asking, whatever the program asks for:
      for _, mode in ipairs {'click', 'drag', 'move'} do
         by_program = lvterm.new(5, 20)
         by_program:write('\27[?' .. ({click = 1000, drag = 1002, move = 1003})[mode] .. 'h\27[?1006h')
         by_call = lvterm.new(5, 20)
         by_call:set_termprop('mouse', mode)
         by_call:write '\27[?1006h'
         expect(clicks(by_call, 2, 3, 'left', true)).to_be(clicks(by_program, 2, 3, 'left', true))
         by_call:mouse_move(3, 5)
         by_program:mouse_move(3, 5)
         expect(by_call:output()).to_be(by_program:output())
      end
  - it leaves how the mouse is written to the program:
      term = lvterm.new(5, 20)
      term:set_termprop('mouse', 'click')
      term:write '\27[?1006h'
      expect(clicks(term, 2, 3, 'left', true)).to_be '\27[<0;4;3M'
  - it stops the mouse being told of, when it is none:
      term = lvterm.new(5, 20)
      term:set_termprop('mouse', 'click')
      term:set_termprop('mouse', 'none')
      expect(clicks(term, 2, 3, 'left', true)).to_be ''
  - it sets whether the program is told of the focus, as `focus_reporting` says:
      term = lvterm.new(2, 4)
      term:set_termprop('focusreport', true)
      expect(term:focus_reporting()).to_be(true)
      term:set_termprop('focusreport', false)
      expect(term:focus_reporting()).to_be(false)
  - it diagnoses a property that is not supported, and a value that is not one of its values:
      term = lvterm.new(2, 4)
      expect(term:set_termprop('title', 'x')).to_raise 'unsupported property'
      expect(term:set_termprop(8, 'click')).to_raise 'unsupported property'
      expect(term:set_termprop('mouse', 'everything')).to_raise 'unknown mouse mode'
      expect(term:set_termprop('mouse', true)).to_raise 'unknown mouse mode'
      expect(term:set_termprop('focusreport', 'yes')).to_raise 'not true or false'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:set_termprop('mouse', 'click')).to_be(term)

- describe focus_reporting:
  - it is false to start with:
      term = lvterm.new(2, 4)
      expect(term:focus_reporting()).to_be(false)
  - it follows what the program asks for:
      term = lvterm.new(2, 4)
      term:write '\27[?1004h'
      expect(term:focus_reporting()).to_be(true)
      term:write '\27[?1004l'
      expect(term:focus_reporting()).to_be(false)
  - it is false after a reset, when nothing is sent for the focus any more:
      term = lvterm.new(2, 4)
      term:set_termprop('focusreport', true)
      term:reset(true)
      expect(term:focus_reporting()).to_be(false)
      term:focus_in()
      expect(term:output()).to_be ''

- describe focus_in:
  - it sends nothing when the program did not ask to be told:
      term = lvterm.new(2, 4)
      term:focus_in()
      expect(term:output()).to_be ''
  - it sends the report that the terminal gained the focus when the program asked:
      term = lvterm.new(2, 4)
      term:write '\27[?1004h'
      term:focus_in()
      expect(term:output()).to_be '\27[I'
  - it is sent when set_termprop asked for it as well:
      term = lvterm.new(2, 4)
      term:set_termprop('focusreport', true)
      term:focus_in()
      expect(term:output()).to_be '\27[I'
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:focus_in()).to_be(term)

- describe focus_out:
  - it sends nothing when the program did not ask to be told:
      term = lvterm.new(2, 4)
      term:focus_out()
      expect(term:output()).to_be ''
  - it sends the report that the terminal lost the focus when the program asked:
      term = lvterm.new(2, 4)
      term:write '\27[?1004h'
      term:focus_out()
      expect(term:output()).to_be '\27[O'
  - it sends nothing when the program has asked no more:
      term = lvterm.new(2, 4)
      term:write '\27[?1004h\27[?1004l'
      term:focus_out()
      expect(term:output()).to_be ''
  - it returns the terminal, so calls can be chained:
      term = lvterm.new(2, 4)
      expect(term:focus_out()).to_be(term)
